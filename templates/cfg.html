<!-- cfg.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CFG → PDA</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/cfg.css">
</head>
<body>
    <!-- Input Panel -->
    <div class="page">
        <header>
            <h1>CFG → PDA</h1>
            <nav><a href="/">Home</a> • <a href="/regex">Regex → NFA / DFA</a></nav>
        </header>

        <section id="input-panel" class="panel">
            <h2>Input</h2>
            <label for="cfg-input">CFG rules (one per line) <small style="font-weight:normal;color:#666">— arrow: <code>-&gt;</code> or <code>&rarr;</code> &middot; alt: <code>|</code> &middot; epsilon: <code>ε</code> <code>^</code> <code>n</code> <code>null</code> <code>epsilon</code></small></label>
            <textarea id="cfg-input" rows="6" placeholder="S -> aSb | ^&#10;S -> aS | bS | n"></textarea>

            <label>Test your Strings</label>
            <div id="cfg-multi-checker" class="multi-string-checker">
                <div class="multi-string-row">
                    <input id="cfg-test-input" class="multi-string-input" type="text" placeholder="Input 1" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 2" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 3" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 4" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 5" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
            </div>

            <div class="controls">
                <button id="cfg-convert-btn">Convert</button>
                <button id="cfg-run-btn">Run</button>
                <button id="cfg-reset-btn">Reset</button>
            </div>
        </section>

        <!-- Diagram + Stack Panel -->
        <section id="cfg-diagram-section" class="panel horizontal">
            <div id="cy-pda" class="cytoscape-container"></div>
            <aside id="stack-panel">
                <h3>Stack</h3>
                <div id="stack-contents" class="stack-contents">Empty Stack</div>
            </aside>
        </section>

        <!-- Step Viewer placed BELOW the diagram so a long step list scrolls
             internally instead of pushing the visualization off-screen. -->
        <section id="cfg-steps" class="panel">
            <h2>Steps</h2>
            <ol id="cfg-steps-list"></ol>
        </section>

        <footer>
            <p>PDA simulation shows stack updates live.</p>
        </footer>
    </div>

    <!-- Cytoscape + dagre (layered DAG layout, bundled with dagre v3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
    <!-- Page script -->
    <script src="/static/js/cfg.js"></script>
</body>
</html>
