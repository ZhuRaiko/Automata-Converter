<!-- regex.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Regex → NFA / DFA</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/regex.css">
</head>
<body>
    <!-- Input Panel -->
    <div class="page">
        <header>
            <h1>Regex → NFA / DFA</h1>
            <nav><a href="/">Home</a> • <a href="/cfg">CFG → PDA</a></nav>
        </header>

        <section id="input-panel" class="panel">
            <h2>Input</h2>
            <label for="regex-input">Regular expression <small style="font-weight:normal;color:#666">— union: <code>|</code>, <code>U</code>, or <code>+</code> &middot; Kleene: <code>*</code> &middot; epsilon: <code>ε</code> or <code>E</code></small></label>
            <input id="regex-input" type="text" placeholder="(a+b)*abb  or  (a|b)*abb" />

            <label>Test your Strings</label>
            <div id="regex-multi-checker" class="multi-string-checker">
                <div class="multi-string-row">
                    <input id="test-input" class="multi-string-input" type="text" placeholder="Input 1" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 2" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 3" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 4" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
                <div class="multi-string-row">
                    <input class="multi-string-input" type="text" placeholder="Input 5" />
                    <span class="string-result pending">Not Checked</span>
                    <button type="button" class="simulate-string-btn">Simulate</button>
                </div>
            </div>

            <div class="controls">
                <button id="convert-btn">Convert</button>
                <button id="run-btn">Run</button>
                <button id="reset-btn">Reset</button>
            </div>
        </section>

        <!-- Diagram Panel with NFA / DFA tabs -->
        <section id="diagram-panel" class="panel">
            <div class="tabs">
                <button class="tab-btn active" data-target="nfa">NFA</button>
                <button class="tab-btn" data-target="dfa">DFA</button>
            </div>

            <!-- Current character indicator (shared between NFA and DFA tabs) -->
            <div id="current-char" class="current-char">Current char: <span id="char-display">-</span></div>

            <div id="nfa" class="diagram active">
                <!-- Cytoscape container for NFA -->
                <div id="cy-nfa" class="cytoscape-container"></div>
            </div>

            <div id="dfa" class="diagram">
                <!-- Cytoscape container for DFA -->
                <div id="cy-dfa" class="cytoscape-container"></div>
            </div>
            <div id="current-char" class="current-char">Current char: <span id="char-display">-</span></div>
        </section>

        <!-- Step Viewer placed BELOW the diagram so a long step list scrolls
             internally instead of pushing the visualization off-screen. -->
        <section id="step-viewer" class="panel">
            <h2>Steps</h2>
            <ol id="steps-list">
                <!-- JS will populate step items here -->
            </ol>
        </section>

        <footer>
            <p>Diagrams rendered with Cytoscape.js (CDN). No build tools required.</p>
        </footer>
    </div>

    <!-- Cytoscape + dagre (layered DAG layout, bundled with dagre v3) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre/cytoscape-dagre.js"></script>
    <!-- Page script -->
    <script src="/static/js/regex.js"></script>
</body>
</html>
